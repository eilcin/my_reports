<!DOCTYPE html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Günlük Futbol Analiz</title><style>
:root{--bg:#0f1115;--panel:#171a21;--border:#2a2e37;--text:#e7e9ee;--muted:#9aa1ad;--accent:#f2b705;--good:#3ddc84}
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:18px}
.nav a{color:var(--accent);text-decoration:none;font-size:14px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:26px 0 10px}
.tbl{overflow-x:auto;border-radius:10px;background:var(--panel);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 11px;text-align:left;font-size:14px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);padding:14px;background:var(--panel);border-radius:10px;font-size:14px;border:1px solid var(--border)}
.val{color:var(--good);font-weight:700}
.sig{color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;margin-top:30px}
ul.days{list-style:none;padding:0;margin:0}
ul.days li{margin:0 0 8px}
ul.days a{display:block;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none}
ul.days a:hover{border-color:var(--accent)}
.latest a{border-color:var(--accent)}
</style></head><body><div class='wrap'><div class='nav'><a href='../'>&larr; Zcode raporu</a></div><h1>Günlük Futbol Analiz</h1><div class='meta'>Bir gün seç</div><ul class='days'><li class='latest'><a href='2026-11-24.html'>2026-11-24 &middot; Salı &middot; en son</a></li></ul></div></body></html>
